name: e_kiem_excel may sach
on:
  push:
    paths: ["e_kiem_excel/**", "docs/goi-gui-engine/sdk-2.2.0/**", ".github/workflows/ex-6-may-sach.yml"]
  pull_request:
    paths: ["e_kiem_excel/**", "docs/goi-gui-engine/sdk-2.2.0/**", ".github/workflows/ex-6-may-sach.yml"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  may-sach:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Chuẩn bị wheel có SHA-256 trong lock
        run: |
          python -m pip download --only-binary=:all: --require-hashes --no-deps -r e_kiem_excel/goi/e_kiem_excel/requirements.lock -d .venv/banh
      - name: Cài sạch offline và kiểm bằng CoreGia
        run: sh e_kiem_excel/tests/kiem_may_sach.sh .venv/banh
      - name: Cài pytest cho kiểm mã tham chiếu
        run: python -m pip install pytest==9.0.2
      - name: Kiểm đầy đủ ba lệnh trên Python 3.11
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONUTF8: "1"
        run: |
          python -m pip install --no-index --no-deps docs/goi-gui-engine/sdk-2.2.0/kho_tri_thuc_sdk-2.2.0-py3-none-any.whl
          python -m pip install --no-index --find-links .venv/banh --require-hashes --no-deps -r e_kiem_excel/goi/e_kiem_excel/requirements.lock
          python -m kho_tri_thuc_sdk.thu e_kiem_excel/goi/e_kiem_excel
          python -m pytest e_kiem_excel/tests -q
          python e_kiem_excel/tests/kiem_doc_lap.py
