name: OCR-6 may sach Linux
on:
  pull_request:
    paths:
      - 'e_ocr/**'
      - 'docs/goi-gui-engine/sdk-2.5.0/**'
      - '.github/workflows/ocr-6-may-sach.yml'
  workflow_dispatch:
jobs:
  may-sach:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Chuan bi wheel Linux dung lock va hash
        run: python -m pip download --require-hashes --only-binary=:all: --no-deps -r e_ocr/goi/e_ocr/requirements.lock -d "${{ runner.temp }}/e-ocr-wheels"
      - name: Cai va kiem ngoai tuyen tren may sach
        run: bash e_ocr/tests/kiem_may_sach.sh
        env:
          WHEELHOUSE: ${{ runner.temp }}/e-ocr-wheels
